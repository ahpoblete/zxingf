plugins {
  id 'com.android.library'
}

android {
  namespace 'com.google.zxing.client.android.core'
  compileSdk 34

  defaultConfig {
    minSdk 19
  }

  sourceSets {
    main {
      java.srcDirs = ['src/main/java']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  lint {
    abortOnError false
  }
}
